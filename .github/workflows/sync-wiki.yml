name: Mirror STO Wiki content and media

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */12 * * *"

permissions:
  contents: read

concurrency:
  group: stowiki-content-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      STOWIKI_MAX_ASSETS: "10000"
      STOWIKI_MAX_TOTAL_MB: "5000"
      STOWIKI_MAX_FILE_MB: "100"
      STOWIKI_API_DELAY_SECONDS: "0.15"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate sync script syntax
        run: python -m py_compile scripts/sync_stowiki.py
      - name: Export wiki pages and download media
        run: python scripts/sync_stowiki.py
      - name: Upload complete mirror as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: stowiki-mirror-${{ github.run_number }}
          path: mirror/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
